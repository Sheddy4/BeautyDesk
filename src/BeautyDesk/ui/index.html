<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" id="theme">
</head>
<body>
  <!-- Одна страница на все окна оболочки; какое из них показать, решает параметр role в адресе. -->

  <!-- Верхняя панель -->
  <div id="bar" class="surface">
    <div class="group">
      <button id="sys-button" class="plain">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 1.5l6.5 6.5L8 14.5 1.5 8z" fill="currentColor"/></svg>
      </button>
      <span id="active-app" class="brand"></span>
    </div>
    <div class="group">
      <button id="tray-more" class="plain" hidden>
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <div id="tray"></div>
      <span id="layout"></span>
      <button id="quick" class="plain" data-i18n-title="bar.quick">
        <span id="volume"></span>
        <span id="network"></span>
        <span id="battery"></span>
      </button>
      <button id="clock" class="plain" data-i18n-title="bar.notifications"></button>
    </div>
  </div>

  <!-- Док: иконки добавляет dock.js -->
  <div id="dock"></div>

  <!-- «Остров» с текущим треком -->
  <div id="island">
    <div class="island-row">
      <img id="media-cover" alt="">
      <div class="media-text">
        <div id="media-title"></div>
        <div id="media-artist"></div>
      </div>
      <div class="media-bars"><i></i><i></i><i></i></div>
    </div>
    <div class="island-more">
      <div id="media-progress"><div id="media-progress-fill"></div></div>
      <div class="media-times"><span id="media-position"></span><span id="media-duration"></span></div>
      <div class="media-controls">
        <button id="media-previous" class="plain" data-i18n-title="media.previous">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 3h1.6v10H3zM13 3v10L5.5 8z" fill="currentColor"/></svg>
        </button>
        <button id="media-toggle" class="plain" data-i18n-title="media.toggle"></button>
        <button id="media-next" class="plain" data-i18n-title="media.next">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M11.4 3H13v10h-1.6zM3 3v10l7.5-5z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Виджеты на рабочем столе: содержимое добавляет widgets.js -->
  <div id="desktop"></div>
  <div id="widget-palette" hidden></div>

  <!-- Лаунчер по клавише Win -->
  <div id="launcher" class="surface">
    <input id="launcher-search" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="launcher.search">
    <div id="launcher-scroll">
      <div class="launcher-title" id="launcher-pinned-title" data-i18n="launcher.pinned"></div>
      <div class="launcher-grid" id="launcher-pinned"></div>
      <div class="launcher-title" id="launcher-all-title" data-i18n="launcher.all"></div>
      <div class="launcher-grid" id="launcher-all"></div>
      <div id="launcher-empty" class="muted" data-i18n="launcher.empty" hidden></div>
    </div>
  </div>

  <!-- Окно настроек: содержимое рисует settings.js -->
  <div id="settings" class="surface">
    <div class="settings-header">
      <span id="settings-title"></span>
      <button id="settings-close" class="plain">✕</button>
    </div>
    <div id="settings-body"></div>
    <div id="settings-version" class="muted"></div>
  </div>

  <!-- Выпадающее меню -->
  <div id="menu" class="surface"></div>

  <script src="shell.js"></script>
  <script src="bar.js"></script>
  <script src="dock.js"></script>
  <script src="island.js"></script>
  <script src="menu.js"></script>
  <script src="launcher.js"></script>
  <script src="settings.js"></script>
  <script src="widgets/clock.js"></script>
  <script src="widgets/calendar.js"></script>
  <script src="widgets/weather.js"></script>
  <script src="widgets/hardware.js"></script>
  <script src="widgets/player.js"></script>
  <script src="widgets/notes.js"></script>
  <script src="widgets/todo.js"></script>
  <script src="widgets/timer.js"></script>
  <script src="widgets/system.js"></script>
  <script src="widgets.js"></script>
  <script>BD.start();</script>
</body>
</html>
