<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" id="theme">
</head>
<body>
  <!-- Одна страница на все окна оболочки; какое из них показать, решает параметр role в адресе. -->

  <!-- Верхняя панель -->
  <div id="bar" class="surface">
    <div class="group">
      <button id="sys-button" class="plain">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 1.5l6.5 6.5L8 14.5 1.5 8z" fill="currentColor"/></svg>
      </button>
      <span id="active-app" class="brand"></span>
    </div>
    <div class="group">
      <div id="tray"></div>
      <span id="layout"></span>
      <button id="quick" class="plain" data-i18n-title="bar.quick">
        <span id="volume"></span>
        <span id="network"></span>
        <span id="battery"></span>
      </button>
      <button id="clock" class="plain" data-i18n-title="bar.notifications"></button>
    </div>
  </div>

  <!-- Док. Пока каркас. -->
  <div id="dock" class="surface">
    <span class="muted" data-i18n="dock.placeholder"></span>
  </div>

  <!-- «Остров» с текущим треком -->
  <div id="island">
    <div class="island-row">
      <img id="media-cover" alt="">
      <div class="media-text">
        <div id="media-title"></div>
        <div id="media-artist"></div>
      </div>
      <div class="media-bars"><i></i><i></i><i></i></div>
    </div>
    <div class="island-more">
      <div id="media-progress"><div id="media-progress-fill"></div></div>
      <div class="media-times"><span id="media-position"></span><span id="media-duration"></span></div>
      <div class="media-controls">
        <button id="media-previous" class="plain" data-i18n-title="media.previous">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 3h1.6v10H3zM13 3v10L5.5 8z" fill="currentColor"/></svg>
        </button>
        <button id="media-toggle" class="plain" data-i18n-title="media.toggle"></button>
        <button id="media-next" class="plain" data-i18n-title="media.next">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M11.4 3H13v10h-1.6zM3 3v10l7.5-5z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Выпадающее меню -->
  <div id="menu" class="surface"></div>

  <script src="shell.js"></script>
  <script src="bar.js"></script>
  <script src="island.js"></script>
  <script src="menu.js"></script>
  <script>BD.start();</script>
</body>
</html>
